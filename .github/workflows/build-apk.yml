name: Build and Release Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java Major Version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Could not detect Java major version."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java 17 or higher is required. Found Java $JAVA_MAJOR."
            exit 1
          fi
          echo "Java environment verification successful."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkey -v -keystore ./debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "ERROR: debug.keystore could not be created."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "ERROR: Exact APK file $APK_PATH not found or empty."
            echo "Scanning app/build/outputs/apk for any APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            fi
            exit 1
          fi
          echo "APK successfully verified at $APK_PATH."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_RELEASE_DIR=$(mktemp -d)
          cp "app/build/outputs/apk/debug/app-debug.apk" "$TEMP_RELEASE_DIR/app-debug.apk"
          if [ ! -s "$TEMP_RELEASE_DIR/app-debug.apk" ]; then
            echo "ERROR: Prepared APK asset is missing or empty."
            exit 1
          fi
          echo "apk_path=$TEMP_RELEASE_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset at: $TEMP_RELEASE_DIR/app-debug.apk"

      - name: Publish APK to GitHub Releases
        id: release_step
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          RELEASE_APK="${{ steps.prepare_asset.outputs.apk_path }}"
          if [ ! -f "$RELEASE_APK" ] || [ ! -s "$RELEASE_APK" ]; then
            echo "ERROR: Prepared APK is not valid."
            exit 1
          fi
          if [[ "$RELEASE_APK" != *.apk ]]; then
            echo "ERROR: Release file does not end in .apk."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          gh release create "$RELEASE_TAG" \
            "$RELEASE_APK" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "### Automated Debug APK Build
          - **Build Run:** #${{ github.run_number }} (Attempt ${{ github.run_attempt }})
          - **Commit SHA:** \`${{ github.sha }}\`
          - **Source:** Automatically built by GitHub Actions workflow.
          - **Note:** This is a debug build signed with a temporary debug keystore for testing purposes only."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.release_step.outcome }}" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            gh release view "$RELEASE_TAG" || true
            DIRECT_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"
            echo "=================================================="
            echo "DIRECT APK DOWNLOAD URL:"
            echo "$DIRECT_URL"
            echo "Asset: app-debug.apk"
            echo "Actions backup artifact 'app-debug-apk' is also preserved."
            echo "=================================================="
            {
              echo "### 📱 DIRECT APK DOWNLOAD"
              echo ""
              echo "[\`app-debug.apk\`]($DIRECT_URL)"
              echo ""
              echo "*Permanent latest download link:* \`$DIRECT_URL\`"
              echo ""
              echo "> Actions artifact \`app-debug-apk\` is also available as backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning ::GitHub Release publishing did not succeed or was skipped. However, if the APK build succeeded, the GitHub Actions artifact 'app-debug-apk' remains available in this run."
          fi
